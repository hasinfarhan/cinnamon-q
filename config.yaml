# Project arynosQ Configuration File
# Configuration as Code - All system settings are defined here

system:
  heartbeat_interval: 60  # seconds - Main execution loop interval
  db_url: "sqlite:///arynosq.db"  # Database connection URL

strategies:
  # Traditional momentum strategy (disabled for now)
  # - name: "momentum_bluechip"
  #   signal: "momentum"
  #   interval: "1d"  # Daily execution
  #   params:
  #     window: 30  # 30-day momentum window
  #     k: 3  # Top 3 assets for equal-weight allocation

  # HDRL PPO Strategy - v1.2 High-Frequency Upgrade
  - name: "crypto_hdrl_v1"
    signal: "ppo"
    interval: "15m"  # Run every 15 minutes (96 decisions per day)
    params:
      # Point to the files we prepared/recovered
      model_path: "models/hdrl_optimized/final_model.zip"
      vec_norm_path: "models/hdrl_optimized/vec_normalize.pkl"
      data_path: "data/processed/crypto_training_data.parquet"
      # Window sizes for 15-minute bars:
      # window_size: 96 = 24 hours of 15m bars (1 day trend)
      # training_window_size: 300 = ~3 days for normalization history
      window_size: 96
      training_window_size: 300

execution:
  provider: "alpaca"
  paper: true  # Use paper trading (set to false for live trading)

# Optimizer configuration (Bicameral Brain v2.1)
optimizer:
  method: "max_sharpe"  # Options: "max_sharpe", "min_volatility", "efficient_risk", "efficient_return"
  risk_aversion: 1.0  # For quadratic utility (higher = more risk averse)
  lookback_days: 90  # Days of history for covariance matrix calculation
  risk_free_rate: 0.0  # Risk-free rate for Sharpe ratio calculation (0.0 for crypto)

# Data configuration (for data fetcher)
data:
  tickers:
    - "AAPL"
    - "MSFT"
    - "GOOGL"
    - "TSLA"
    - "NVDA"
  period: "5y"  # 5 years of historical data
  output_path: "data/processed/market_data.parquet"

